<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D7A4C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scale to 80">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Scale to 80</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one-column phone app, capped at 520px, sticky top bar, fixed bottom tab bar; kitchen-scale LCD readouts for numbers */
:root{
  --bg:#F2F6F1;--surface:#FFFFFF;--ink:#15211A;--muted:#5A6A60;--line:#DAE3DB;
  --accent:#1D7A4C;--accent-ink:#FFFFFF;--accent-soft:#E0EFE5;
  --warn:#A86A12;--over:#C0402C;--lcd:#DCE7D3;--lcd-ink:#1B2A1F;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1310;--surface:#151D18;--ink:#E5EDE7;--muted:#91A198;--line:#25312A;
  --accent:#4DBE82;--accent-ink:#06150D;--accent-soft:#18301F;
  --warn:#E2A84B;--over:#F2735E;--lcd:#18271D;--lcd-ink:#B6EFC6;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1310;--surface:#151D18;--ink:#E5EDE7;--muted:#91A198;--line:#25312A;
  --accent:#4DBE82;--accent-ink:#06150D;--accent-soft:#18301F;
  --warn:#E2A84B;--over:#F2735E;--lcd:#18271D;--lcd-ink:#B6EFC6;color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:520px;margin:0 auto;padding-block:0 110px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:14px 10px}
.top h1{font-size:20px;flex:1}
.datenav{display:flex;align-items:center;gap:4px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;font-size:18px;line-height:1}
.daylabel{font-weight:600;min-width:108px;text-align:center;font-size:14px}
.view{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
/* budget */
.budget{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:var(--line)}
.ring .bar{stroke:var(--accent);transition:stroke-dashoffset .4s}
.ring .bar.over{stroke:var(--over)}
.ring-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-c b{font-family:var(--f-num);font-size:26px;font-weight:500;line-height:1.1}
.ring-c span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.stats{display:grid;gap:8px;min-width:0}
.stat{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.stat .num{font-weight:500}
.macro{display:grid;gap:4px}
.mbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.mbar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.daytag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.daytag.fast{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.note{font-size:13px;color:var(--muted);margin:10px 0 0}
.banner{border:1px dashed var(--warn);color:var(--ink);background:color-mix(in srgb,var(--warn) 8%,transparent);border-radius:12px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner button{border:0;background:var(--warn);color:var(--surface);border-radius:8px;padding:6px 10px;font-weight:600;white-space:nowrap}
/* meals */
.meal-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
.meal-h h3{font-size:16px}
.entry{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.entry:first-of-type{border-top:0}
.entry .nm{min-width:0;cursor:pointer}
.entry .nm div{font-weight:500;overflow-wrap:anywhere}
.entry .nm small{color:var(--muted);font-size:12px}
.entry .kc{font-family:var(--f-num);font-size:14px}
.del{border:0;background:none;color:var(--muted);font-size:18px;width:28px;height:28px;border-radius:8px}
.del:hover{background:var(--accent-soft)}
.chip{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:1px}
.chip.cheat{background:color-mix(in srgb,var(--over) 15%,transparent);color:var(--over)}
.chip.rice{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.addrow{margin-top:8px;width:100%;border:1px dashed var(--line);background:none;border-radius:10px;padding:9px;color:var(--accent);font-weight:600}
.empty{font-size:13px;color:var(--muted);padding:4px 0 2px}
/* week */
.wk{display:grid;gap:10px}
.wkrow{display:grid;grid-template-columns:44px 1fr 92px;gap:10px;align-items:center;font-size:14px}
.wkbar{position:relative;height:22px;background:var(--line);border-radius:6px;overflow:hidden}
.wkbar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:6px}
.wkbar i.over{background:var(--over)}
.wkrow .num{text-align:right;font-size:13px}
.wkrow.today .d{font-weight:700;color:var(--accent)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kv .panel{padding:12px 14px}
.kv b{display:block;font-family:var(--f-num);font-weight:500;font-size:22px;margin-top:2px}
/* weight */
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.wlog{display:flex;gap:8px;align-items:stretch}
.wlist{display:grid;gap:0}
.wlist .entry{grid-template-columns:1fr auto auto}
/* inputs */
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:12px 16px;font-weight:600}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* lcd */
.lcd{background:var(--lcd);color:var(--lcd-ink);border-radius:14px;padding:12px 14px;display:flex;align-items:baseline;gap:6px;box-shadow:inset 0 2px 6px rgba(0,0,0,.12)}
.lcd input{background:transparent;border:0;padding:0;font-family:var(--f-num);font-size:44px;color:var(--lcd-ink);width:100%;text-align:right;font-variant-numeric:tabular-nums}
.lcd input:focus-visible{outline:none}
.lcd .u{font-family:var(--f-num);font-size:20px}
.lcd-cap{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.7;align-self:flex-start;white-space:nowrap}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:none;padding:8px 4px;border-radius:10px;font-size:12px;font-weight:600;color:var(--muted);display:grid;gap:2px;justify-items:center}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--accent)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,12,8,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.flist{display:grid;max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.fitem{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.fitem:first-child{border-top:0}
.fitem:hover{background:var(--accent-soft)}
.fitem small{color:var(--muted);font-family:var(--f-num);font-size:12px;white-space:nowrap}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.calc div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 4px}
.calc b{display:block;font-family:var(--f-num);font-weight:500;font-size:17px}
.calc span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{width:20px;height:20px}
.hero{display:flex;align-items:baseline;gap:8px;margin:6px 0 6px;flex-wrap:wrap}
.hero b{font-family:var(--f-num);font-weight:500;font-size:46px;line-height:1}
.hero-w{font-family:var(--f-display);font-weight:700;font-size:20px}
.hero-u{color:var(--muted);font-size:14px}
.hero.good b,.hero.good .hero-w{color:var(--accent)}
.hero.warn b,.hero.warn .hero-w{color:var(--warn)}
.hero.over b,.hero.over .hero-w{color:var(--over)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
.pill.good{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.pill.over{background:color-mix(in srgb,var(--over) 14%,transparent);color:var(--over)}
.ledger{display:grid;margin-top:12px;border-top:1px solid var(--line)}
.ledger div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.ledger .num{font-variant-numeric:tabular-nums}
.ledger .tot{font-weight:700;border-bottom:0}
.ledger .tot.good{color:var(--accent)}.ledger .tot.warn{color:var(--warn)}.ledger .tot.over{color:var(--over)}
.dvrow{display:grid;grid-template-columns:40px 1fr 70px;gap:10px;align-items:center;font-size:14px}
.dvrow.today .d{font-weight:700;color:var(--accent)}
.dvrow .num{text-align:right;font-size:13px;font-family:var(--f-num)}
.dv{position:relative;height:22px;background:var(--bg);border-radius:6px;overflow:hidden}
.dv .axis{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--muted);opacity:.6}
.dv .goal{position:absolute;top:3px;bottom:3px;width:2px;background:var(--ink);opacity:.45}
.dv i{position:absolute;top:3px;bottom:3px;border-radius:4px}
.dv i.good{background:var(--accent)}.dv i.over{background:var(--over)}
.daytag{white-space:nowrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;z-index:30;max-width:90%}
.sync{font-size:11px;color:var(--muted)}
@media (max-width:380px){.budget{grid-template-columns:1fr;justify-items:center}.stats{width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <h1 id="title">Today</h1>
    <div class="datenav" id="datenav">
      <button class="icon-btn" id="prev" aria-label="Previous day">‹</button>
      <div class="daylabel" id="daylabel"></div>
      <button class="icon-btn" id="next" aria-label="Next day">›</button>
    </div>
  </header>
  <main id="main" class="view"></main>
</div>

<nav class="tabs" aria-label="Sections"><div class="tabs-in" role="tablist">
  <button class="tab" role="tab" data-tab="today" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="12" width="18" height="7" rx="2"/><path d="M7 12V9a5 5 0 0 1 10 0v3"/></svg>Today</button>
  <button class="tab" role="tab" data-tab="week" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 20V10M10 20V4M15 20v-7M20 20v-11"/></svg>Week</button>
  <button class="tab" role="tab" data-tab="weight" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 17l5-5 4 3 8-8"/><path d="M15 7h5v5"/></svg>Weight</button>
  <button class="tab" role="tab" data-tab="plan" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>Plan</button>
</div></nav>

<div id="sheetRoot"></div>

<script>
/* ---------- constants ---------- */
const MEALS=["11 am meal","7 pm meal"];
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const ACTS=["Walking","Brisk walking","Running","Cycling","Yoga","Gym / weights","Swimming","Badminton","Cricket","Stairs"];
const DEFAULTS={sex:"m",age:40,height:170,activity:1.2,startDate:"2026-10-27",startWeight:100,goalWeight:80,weeks:52};

/* ---------- state ---------- */
const S={docs:{},tab:"today",date:ymd(new Date())};
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parse(s){const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)}
const settings=()=>{const s=Object.assign({},DEFAULTS,S.docs.settings||{});if(!s.height)s.height=170;return s};
const dayDoc=date=>{const d=S.docs["d-"+date]||{};return{entries:d.entries||[],acts:d.acts||[]}};
const weights=()=>((S.docs.weights||{}).list||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
const r0=n=>Math.round(n), r1=n=>Math.round(n*10)/10;
const fmt=n=>r0(n).toLocaleString("en-IN");

/* ---------- storage: this phone only ---------- */
const LKEY="scale80-v1";
try{const raw=localStorage.getItem(LKEY);if(raw)S.docs=JSON.parse(raw).docs||{}}catch(e){}
function save(id,body){
  S.docs[id]=body;
  try{localStorage.setItem(LKEY,JSON.stringify({docs:S.docs}))}catch(e){toast("Could not save. Phone storage may be full.")}
}
function saveDay(date,doc){save("d-"+date,{entries:doc.entries,acts:doc.acts})}
function exportBackup(){
  const blob=new Blob([JSON.stringify({app:"scale80",version:2,saved:new Date().toISOString(),docs:S.docs},null,1)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="scale80-backup-"+ymd(new Date())+".json";
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  try{localStorage.setItem("scale80-lastbackup",ymd(new Date()))}catch(e){}
  toast("Backup saved to Downloads");
}
function importBackup(file){
  const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.docs)throw 0;S.docs=j.docs;save("settings",S.docs.settings||{});render();toast("Backup restored")}catch(e){toast("That file is not a Scale to 80 backup")}};
  r.readAsText(file);
}

/* ---------- history: remembers what you entered before ---------- */
function history(kind){
  const m={};
  Object.keys(S.docs).filter(k=>k.startsWith("d-")).sort().forEach(k=>{
    const d=S.docs[k];
    (kind==="food"?d.entries||[]:d.acts||[]).forEach(e=>{m[e.n.toLowerCase()]=e});
  });
  return m;
}

/* ---------- math ---------- */
function plan(){
  const s=settings();const ws=weights();
  const cur=ws.length?ws[ws.length-1].kg:s.startWeight;
  const bmr=10*cur+6.25*s.height-5*s.age+(s.sex==="m"?5:-161);
  const maint=bmr*s.activity;
  const goal=(s.startWeight-s.goalWeight)*7700/(s.weeks*7);
  return {cur,bmr,maint,goal};
}
function day(date){
  const d=dayDoc(date),p=plan();
  const eat=d.entries.reduce((a,e)=>a+e.k,0), burn=d.acts.reduce((a,e)=>a+e.k,0);
  const prot=d.entries.reduce((a,e)=>a+(e.p||0),0);
  const logged=d.entries.length>0;
  return {eat,burn,prot,maint:p.maint,net:p.maint+burn-eat,goal:p.goal,logged,doc:d};
}
function weekStart(date){const d=parse(date);const off=(d.getDay()+6)%7;d.setDate(d.getDate()-off);return ymd(d)}
function loggedDays(from,to){return Object.keys(S.docs).filter(k=>k.startsWith("d-")).map(k=>k.slice(2)).filter(d=>d>=from&&d<=to&&dayDoc(d).entries.length).sort()}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function dayName(date){const today=ymd(new Date());if(date===today)return"Today";if(date===addDays(today,-1))return"Yesterday";if(date===addDays(today,1))return"Tomorrow";
  const d=parse(date);return DOW[d.getDay()]+" "+d.getDate()+" "+d.toLocaleString("en",{month:"short"})}
function verdict(net,goal){
  if(net<0)return{cls:"over",word:"Excess",chip:"Over maintenance"};
  if(net>=goal)return{cls:"good",word:"Deficit",chip:"Goal reached"};
  return{cls:"warn",word:"Deficit",chip:"Below goal"};
}

/* ---------- render ---------- */
function render(){
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===S.tab));
  $("#datenav").hidden=!(S.tab==="today"||S.tab==="week");
  const ws=parse(weekStart(S.date));
  $("#daylabel").textContent=S.tab==="week"?"Week of "+ws.getDate()+" "+ws.toLocaleString("en",{month:"short"}):dayName(S.date);
  $("#title").textContent={today:"Day",week:"Week",weight:"Weight",plan:"Your plan"}[S.tab];
  const m=$("#main");
  m.innerHTML=S.tab==="today"?viewToday():S.tab==="week"?viewWeek():S.tab==="weight"?viewWeight():viewPlan();
  bindView();
}

function viewToday(){
  const t=day(S.date),dow=parse(S.date).getDay(),today=ymd(new Date());
  const v=verdict(t.net,t.goal);
  const canEat=t.maint+t.burn-t.goal-t.eat;
  let tag=dow===1?'<span class="daytag fast">Fast day · water only till 7 pm</span>':dow===0?'<span class="daytag">Sunday · cheat meal day</span>':"";
  let h=`<section class="panel">
    <div class="meal-h" style="margin-bottom:2px"><span class="eyebrow">${S.date===today&&t.logged?"So far today":S.date===today?"Today":dayName(S.date)}</span>${tag}</div>
    <div class="hero ${t.logged?v.cls:""}"><span class="hero-w">${t.logged?v.word:"Deficit"}</span><b class="num">${t.logged?fmt(Math.abs(t.net)):"–"}</b><span class="hero-u">kcal</span></div>
    ${t.logged?`<span class="pill ${v.cls}">${v.chip} · goal ${fmt(t.goal)} kcal</span>`:`<p class="note" style="margin:4px 0 0">Log your first meal to see the deficit.</p>`}
    <div class="ledger">
      <div><span>Body burns (maintenance)</span><span class="num">${fmt(t.maint)}</span></div>
      <div><span>+ Exercise</span><span class="num">${fmt(t.burn)}</span></div>
      <div><span>− Food eaten</span><span class="num">${fmt(t.eat)}</span></div>
      <div class="tot ${t.logged?v.cls:""}"><span>= ${t.net<0&&t.logged?"Excess":"Deficit"}</span><span class="num">${t.logged?(t.net<0?"+":"")+fmt(Math.abs(t.net)):"–"}</span></div>
    </div>
    ${t.prot>0?`<p class="note">Protein logged: ${r0(t.prot)} g</p>`:""}
    ${S.date>=today?`<p class="note">${canEat>0?`You can eat about <b>${fmt(canEat)} kcal</b> more today and still hit your goal deficit.`:`You are ${fmt(-canEat)} kcal past today's goal. A walk or a lighter next meal will help.`}</p>`:""}
  </section>`;
  const meals=dow===1&&!t.doc.entries.some(e=>e.meal==="11 am meal")?["7 pm meal"]:MEALS;
  for(const meal of meals){
    const es=t.doc.entries.filter(e=>e.meal===meal||(!MEALS.includes(e.meal)&&meal===meals[meals.length-1]));
    const mk=es.reduce((a,e)=>a+e.k,0);
    h+=`<section class="panel"><div class="meal-h"><h3>${meal}</h3><span class="num small muted">${fmt(mk)} kcal</span></div>`;
    if(!es.length)h+=`<div class="empty">Nothing logged.</div>`;
    es.forEach(e=>{h+=`<div class="entry"><div class="nm" data-edit="${e.id}"><div>${esc(e.n)}${e.cheat?'<span class="chip cheat">Cheat</span>':""}${e.rice?'<span class="chip rice">Rice</span>':""}</div>
      <small>${e.g?e.g+" g":"no weight"}${e.p?" · P "+r0(e.p)+" g":""}</small></div><span class="kc">${fmt(e.k)}</span><button class="del" data-del="${e.id}" aria-label="Remove ${esc(e.n)}">×</button></div>`});
    h+=`<button class="addrow" data-add="${meal}">+ Add food</button></section>`;
  }
  h+=`<section class="panel"><div class="meal-h"><h3>Exercise</h3><span class="num small muted">${fmt(t.burn)} kcal burned</span></div>`;
  if(!t.doc.acts.length)h+=`<div class="empty">No exercise logged.</div>`;
  t.doc.acts.forEach(e=>{h+=`<div class="entry"><div class="nm" data-aedit="${e.id}"><div>${esc(e.n)}</div><small>${e.min?e.min+" min":""}</small></div><span class="kc">${fmt(e.k)}</span><button class="del" data-adel="${e.id}" aria-label="Remove ${esc(e.n)}">×</button></div>`});
  h+=`<button class="addrow" data-act="1">+ Add exercise</button></section>`;
  h+=`<p class="sync">Saved on this phone only. Back up weekly from the Plan tab.</p>`;
  return h;
}

function viewWeek(){
  const ws=weekStart(S.date),today=ymd(new Date());
  const days=[...Array(7)].map((_,i)=>addDays(ws,i));
  let total=0,n=0,rice=0,cheat=0,burn=0,max=1;
  const ds=days.map(d=>{const t=day(d);if(t.logged){total+=t.net;n++;burn+=t.burn;max=Math.max(max,Math.abs(t.net))}
    if(t.doc.entries.some(e=>e.rice))rice++;if(t.doc.entries.some(e=>e.cheat))cheat++;return [d,t]});
  max=Math.max(max,ds[0][1].goal*1.2);
  const goalWeek=ds[0][1].goal*7, goalSoFar=ds[0][1].goal*n;
  const v=verdict(total,goalSoFar||1);
  let rows=ds.map(([d,t])=>{
    const w=t.logged?Math.abs(t.net)/max*50:0;
    return `<div class="dvrow ${d===today?"today":""}"><span class="d">${DOW[parse(d).getDay()]}</span>
      <div class="dv"><span class="axis"></span><span class="goal" style="left:${50+t.goal/max*50}%"></span>
      ${t.logged?`<i class="${t.net<0?"over":"good"}" style="${t.net<0?`right:50%`:`left:50%`};width:${w}%"></i>`:""}</div>
      <span class="num">${t.logged?(t.net<0?"+":"−")+fmt(Math.abs(t.net)):"–"}</span></div>`}).join("");
  return `<section class="panel">
    <span class="eyebrow">Week deficit · ${n} of 7 days logged</span>
    <div class="hero ${n?v.cls:""}"><span class="hero-w">${total<0?"Excess":"Deficit"}</span><b class="num">${n?fmt(Math.abs(total)):"–"}</b><span class="hero-u">kcal</span></div>
    <p class="note" style="margin:4px 0 0">Weekly goal: ${fmt(goalWeek)} kcal deficit. ${n?`That is about <b>${r1(Math.max(total,0)/7700)} kg</b> of fat this week.`:""}</p>
  </section>
  <section class="panel"><div class="meal-h"><h3>Day by day</h3><span class="small muted">right = deficit · left = excess</span></div>
    <div class="wk">${rows}</div>
    <p class="note">The thin tick marks your daily goal of ${fmt(ds[0][1].goal)} kcal. Monday's fast usually covers Sunday's cheat meal.</p></section>
  <section class="kv">
    <div class="panel"><span class="eyebrow">Exercise</span><b>${fmt(burn)}</b><span class="small muted">kcal burned</span></div>
    <div class="panel"><span class="eyebrow">Avg per day</span><b>${n?fmt(total/n):"–"}</b><span class="small muted">kcal deficit</span></div>
    <div class="panel"><span class="eyebrow">White rice days</span><b style="color:${rice>1?"var(--warn)":"inherit"}">${rice} / 1</b><span class="small muted">rule: once a week</span></div>
    <div class="panel"><span class="eyebrow">Cheat meals</span><b style="color:${cheat>1?"var(--warn)":"inherit"}">${cheat} / 1</b><span class="small muted">Sunday only</span></div>
  </section>`;
}

function viewWeight(){
  const s=settings(),ws=weights(),p=plan();
  const start=parse(s.startDate),end=new Date(start);end.setDate(end.getDate()+s.weeks*7);
  const W=340,H=220,L=36,R=12,T=14,B=28;
  const lo=Math.floor(Math.min(s.goalWeight,...ws.map(w=>w.kg))/5)*5, hi=Math.ceil(Math.max(s.startWeight,...ws.map(w=>w.kg))/5)*5;
  const x=d=>L+(parse(d)-start)/(end-start)*(W-L-R), y=k=>T+(hi-k)/(hi-lo)*(H-T-B);
  let g="";
  for(let k=lo;k<=hi;k+=5)g+=`<line x1="${L}" x2="${W-R}" y1="${y(k)}" y2="${y(k)}" stroke="var(--line)"/><text x="${L-6}" y="${y(k)+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${k}</text>`;
  for(let mth=0;mth<=12;mth+=3){const d=new Date(start);d.setMonth(d.getMonth()+mth);if(d>end)break;
    g+=`<text x="${x(ymd(d))}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)">${d.toLocaleString("en",{month:"short"})}</text>`}
  g+=`<line x1="${x(s.startDate)}" y1="${y(s.startWeight)}" x2="${x(ymd(end))}" y2="${y(s.goalWeight)}" stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1.5"/>`;
  const inRange=ws.filter(w=>parse(w.date)>=start&&parse(w.date)<=end);
  if(inRange.length>1)g+=`<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" points="${inRange.map(w=>x(w.date)+","+y(w.kg)).join(" ")}"/>`;
  inRange.forEach((w,i)=>{g+=`<circle cx="${x(w.date)}" cy="${y(w.kg)}" r="${i===inRange.length-1?4.5:3}" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.5"/>`});
  const today=ymd(new Date());
  const ld=loggedDays(s.startDate,today);
  const totalDef=ld.reduce((a,d)=>a+day(d).net,0);
  const lost=s.startWeight-p.cur;
  const list=ws.slice().reverse().slice(0,12).map(w=>`<div class="entry"><span>${dayName(w.date)}</span><span class="kc">${r1(w.kg)} kg</span><button class="del" data-wdel="${w.date}" aria-label="Remove weigh-in">×</button></div>`).join("");
  return `<section class="kv">
    <div class="panel"><span class="eyebrow">Now</span><b>${r1(p.cur)} kg</b><span class="small muted">${ws.length?"latest weigh-in":"start weight"}</span></div>
    <div class="panel"><span class="eyebrow">Lost on scale</span><b style="color:var(--accent)">${r1(Math.max(lost,0))} kg</b><span class="small muted">of ${r0(s.startWeight-s.goalWeight)} kg goal</span></div>
    <div class="panel"><span class="eyebrow">Total deficit</span><b>${fmt(totalDef)}</b><span class="small muted">kcal over ${ld.length} logged days</span></div>
    <div class="panel"><span class="eyebrow">Expected loss</span><b>${r1(totalDef/7700)} kg</b><span class="small muted">7,700 kcal ≈ 1 kg fat</span></div>
  </section>
  <section class="panel"><div class="meal-h"><h3>Log a weigh-in</h3></div>
    <div class="wlog"><input id="wkg" type="number" inputmode="decimal" step="0.1" placeholder="kg, e.g. 99.4" aria-label="Weight in kg"><input id="wdate" type="date" value="${today}" aria-label="Date" style="max-width:150px"><button class="btn" id="wadd">Save</button></div>
    <p class="note">Weigh once a week, same morning, before food. If the scale loss stays well below the expected loss for 3–4 weeks, some calories are being missed or over-counted.</p></section>
  <section class="panel"><div class="meal-h"><h3>Progress</h3><span class="small muted">dashed = plan</span></div>
    <div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight against plan">${g}</svg></div></section>
  ${ws.length?`<section class="panel"><div class="meal-h"><h3>Weigh-ins</h3></div><div class="wlist">${list}</div></section>`:""}`;
}

function viewPlan(){
  const s=settings(),p=plan();
  let last="never";try{last=localStorage.getItem("scale80-lastbackup")||"never"}catch(e){}
  return `<section class="panel"><span class="eyebrow">How the deficit is counted</span>
    <div class="ledger" style="margin-top:8px">
      <div><span>Maintenance at ${r1(p.cur)} kg</span><span class="num">${fmt(p.maint)} kcal/day</span></div>
      <div><span>Goal deficit</span><span class="num">${fmt(p.goal)} kcal/day</span></div>
      <div><span>Goal deficit per week</span><span class="num">${fmt(p.goal*7)} kcal</span></div>
    </div>
    <p class="note">Each day: maintenance + exercise − food = deficit. A negative result is an excess. Maintenance is an estimate from your height, age and weight, and drops as your weight drops.</p>
    <p class="note">Watches and gym machines often overstate calories burned. If you use their numbers, count about two-thirds of them.</p>
  </section>
  <section class="panel"><span class="eyebrow">About you</span>
    <div class="grid2" style="margin-top:10px">
      <label class="f">Height (cm) · 5′7″ = 170<input id="s-height" type="number" inputmode="numeric" value="${s.height}"></label>
      <label class="f">Age<input id="s-age" type="number" inputmode="numeric" value="${s.age}"></label>
      <label class="f">Sex<select id="s-sex"><option value="m"${s.sex==="m"?" selected":""}>Male</option><option value="f"${s.sex==="f"?" selected":""}>Female</option></select></label>
      <label class="f">Daily life (without exercise)<select id="s-activity">
        ${[[1.2,"Desk job, mostly sitting"],[1.3,"On my feet part of the day"],[1.45,"On my feet most of the day"]].map(([v,l])=>`<option value="${v}"${s.activity==v?" selected":""}>${l}</option>`).join("")}
      </select></label>
    </div>
    <p class="note">Log workouts in the Exercise section, so keep this setting to your normal day without exercise.</p></section>
  <section class="panel"><span class="eyebrow">Goal</span>
    <div class="grid2" style="margin-top:10px">
      <label class="f">Start weight (kg)<input id="s-startWeight" type="number" step="0.1" value="${s.startWeight}"></label>
      <label class="f">Goal weight (kg)<input id="s-goalWeight" type="number" step="0.1" value="${s.goalWeight}"></label>
      <label class="f">Start date<input id="s-startDate" type="date" value="${s.startDate}"></label>
      <label class="f">Weeks<input id="s-weeks" type="number" value="${s.weeks}"></label>
    </div>
    <button class="btn" id="s-save" style="margin-top:12px;width:100%">Save plan</button></section>
  <section class="panel"><span class="eyebrow">Backup</span>
    <p class="note" style="margin-top:6px">Your data lives only in this phone's browser. Clearing browser data deletes it. Save a backup file every week, and restore it if you change phones.</p>
    <div class="grid2" style="margin-top:10px"><button class="btn ghost" id="bk-export">Save backup</button>
    <label class="btn ghost" style="text-align:center">Restore backup<input id="bk-import" type="file" accept="application/json,.json" hidden></label></div>
    <p class="sync" style="margin-top:8px">Last backup: ${last}</p></section>
  <p class="note">This is an estimate, not medical advice. If you take medicines for blood sugar or blood pressure, check the Monday fast with your doctor.</p>`;
}

/* ---------- bindings ---------- */
function bindView(){
  const m=$("#main");
  m.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>foodSheet({meal:b.dataset.add}));
  m.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{const e=dayDoc(S.date).entries.find(x=>x.id===b.dataset.edit);if(e)foodSheet({meal:e.meal,edit:e})});
  m.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const d=dayDoc(S.date);d.entries=d.entries.filter(e=>e.id!==b.dataset.del);saveDay(S.date,d);render();toast("Removed")});
  m.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>actSheet({}));
  m.querySelectorAll("[data-aedit]").forEach(b=>b.onclick=()=>{const e=dayDoc(S.date).acts.find(x=>x.id===b.dataset.aedit);if(e)actSheet({edit:e})});
  m.querySelectorAll("[data-adel]").forEach(b=>b.onclick=()=>{const d=dayDoc(S.date);d.acts=d.acts.filter(e=>e.id!==b.dataset.adel);saveDay(S.date,d);render();toast("Removed")});
  m.querySelectorAll("[data-wdel]").forEach(b=>b.onclick=()=>{save("weights",{list:weights().filter(w=>w.date!==b.dataset.wdel)});render()});
  const wadd=$("#wadd");if(wadd)wadd.onclick=()=>{const kg=parseFloat($("#wkg").value),date=$("#wdate").value;
    if(!(kg>30&&kg<300)||!date){toast("Enter your weight in kg, like 99.4");return}
    save("weights",{list:weights().filter(w=>w.date!==date).concat({date,kg})});render();toast("Weigh-in saved")};
  const bx=$("#bk-export");if(bx)bx.onclick=exportBackup;
  const bi=$("#bk-import");if(bi)bi.onchange=()=>{if(bi.files[0])importBackup(bi.files[0])};
  const ss=$("#s-save");if(ss)ss.onclick=()=>{
    const s=settings();const num=id=>parseFloat($("#s-"+id).value);
    const h=num("height");
    save("settings",{...s,height:h>100&&h<230?h:s.height,age:num("age")||s.age,sex:$("#s-sex").value,activity:num("activity"),
      startWeight:num("startWeight")||s.startWeight,goalWeight:num("goalWeight")||s.goalWeight,startDate:$("#s-startDate").value||s.startDate,
      weeks:Math.max(4,num("weeks")||s.weeks)});
    render();toast("Plan saved")};
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render();window.scrollTo(0,0)});
$("#prev").onclick=()=>{S.date=addDays(S.date,S.tab==="week"?-7:-1);render()};
$("#next").onclick=()=>{S.date=addDays(S.date,S.tab==="week"?7:1);render()};

/* ---------- sheets ---------- */
function sheet(title,body,onReady){
  const root=$("#sheetRoot");
  root.innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="sheet-h"><h2 style="font-size:19px">${esc(title)}</h2><button class="icon-btn" id="x" aria-label="Close">×</button></div>${body}</div></div>`;
  const close=()=>{root.innerHTML="";render()};
  $("#x").onclick=close;$("#scrim").onclick=e=>{if(e.target.id==="scrim")close()};
  onReady(close);
}
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

function foodSheet({meal,edit}){
  const hist=history("food");
  const dow=parse(S.date).getDay();
  let kTouched=!!edit;
  sheet(edit?"Edit food":"Add food",`
    <div class="seg" role="group" aria-label="Meal">${MEALS.map(m=>`<button data-meal="${m}" aria-pressed="${m===meal}">${m}</button>`).join("")}</div>
    <label class="f">Food<input id="fn" list="fl" autocomplete="off" placeholder="e.g. Quinoa, cooked" value="${edit?esc(edit.n):""}"></label>
    <datalist id="fl">${Object.values(hist).map(e=>`<option value="${esc(e.n)}">`).join("")}</datalist>
    <div class="lcd"><span class="lcd-cap">Net wt.</span><input id="fg" type="number" inputmode="decimal" placeholder="0" value="${edit&&edit.g?edit.g:""}" aria-label="Weight in grams"><span class="u">g</span></div>
    <div class="grid2">
      <label class="f">Calories (kcal)<input id="fk" type="number" inputmode="decimal" value="${edit?edit.k:""}"></label>
      <label class="f">Protein g (optional)<input id="fp" type="number" inputmode="decimal" value="${edit&&edit.p?edit.p:""}"></label>
    </div>
    <p class="note" id="fhint" style="margin:0">Type the calories for the amount you weighed, not per 100 g.</p>
    <label class="check"><input type="checkbox" id="frice" ${edit&&edit.rice?"checked":""}> White rice (counts toward once a week)</label>
    <label class="check"><input type="checkbox" id="fcheat" ${edit&&edit.cheat?"checked":""}> Sunday cheat meal${dow!==0?' <span class="small muted">(this day isn’t Sunday)</span>':""}</label>
    <button class="btn" id="fsave">${edit?"Save changes":"Add food"}</button>`,close=>{
    let cur=meal;
    document.querySelectorAll("[data-meal]").forEach(b=>b.onclick=()=>{cur=b.dataset.meal;document.querySelectorAll("[data-meal]").forEach(x=>x.setAttribute("aria-pressed",x===b))});
    const fn=$("#fn"),fg=$("#fg"),fk=$("#fk"),fp=$("#fp");
    fk.oninput=()=>{kTouched=fk.value!==""};
    function suggest(){
      const h=hist[fn.value.trim().toLowerCase()],g=parseFloat(fg.value);
      if(h&&h.g>0&&g>0&&!kTouched){fk.value=r0(h.k/h.g*g);if(h.p)fp.value=r1(h.p/h.g*g);$("#frice").checked=!!h.rice;
        $("#fhint").textContent="Filled from your last entry ("+r0(h.k/h.g*100)+" kcal per 100 g). Change it if needed.";}
    }
    fn.onchange=suggest;fg.oninput=suggest;
    if(!edit)fn.focus();
    $("#fsave").onclick=()=>{
      const n=fn.value.trim(),k=parseFloat(fk.value);
      if(!n){toast("Enter the food name");return}
      if(!(k>=0)){toast("Enter the calories");return}
      const e={id:edit?edit.id:newId(),meal:cur,n,g:parseFloat(fg.value)||0,k:r0(k),p:parseFloat(fp.value)||0,rice:$("#frice").checked,cheat:$("#fcheat").checked};
      const d=dayDoc(S.date);d.entries=edit?d.entries.map(x=>x.id===edit.id?e:x):d.entries.concat(e);
      saveDay(S.date,d);close();toast(edit?"Updated":"Added "+fmt(e.k)+" kcal");
    };
  });
}

function actSheet({edit}){
  const hist=history("act");
  const names=[...new Set(Object.values(hist).map(e=>e.n).concat(ACTS))];
  let kTouched=!!edit;
  sheet(edit?"Edit exercise":"Add exercise",`
    <label class="f">Activity<input id="an" list="al" autocomplete="off" placeholder="e.g. Brisk walking" value="${edit?esc(edit.n):""}"></label>
    <datalist id="al">${names.map(n=>`<option value="${esc(n)}">`).join("")}</datalist>
    <div class="grid2">
      <label class="f">Minutes<input id="am" type="number" inputmode="numeric" value="${edit&&edit.min?edit.min:""}"></label>
      <label class="f">Calories burned<input id="ak" type="number" inputmode="numeric" value="${edit?edit.k:""}"></label>
    </div>
    <p class="note" id="ahint" style="margin:0">Use the number from your watch, app or gym machine.</p>
    <button class="btn" id="asave">${edit?"Save changes":"Add exercise"}</button>`,close=>{
    const an=$("#an"),am=$("#am"),ak=$("#ak");
    ak.oninput=()=>{kTouched=ak.value!==""};
    function suggest(){const h=hist[an.value.trim().toLowerCase()],m=parseFloat(am.value);
      if(h&&h.min>0&&m>0&&!kTouched){ak.value=r0(h.k/h.min*m);$("#ahint").textContent="Filled from your last "+h.n.toLowerCase()+" ("+r1(h.k/h.min)+" kcal per minute). Change it if needed."}}
    an.onchange=suggest;am.oninput=suggest;
    if(!edit)an.focus();
    $("#asave").onclick=()=>{
      const n=an.value.trim(),k=parseFloat(ak.value);
      if(!n){toast("Enter the activity");return}
      if(!(k>=0)){toast("Enter the calories burned");return}
      const e={id:edit?edit.id:newId(),n,min:parseFloat(am.value)||0,k:r0(k)};
      const d=dayDoc(S.date);d.acts=edit?d.acts.map(x=>x.id===edit.id?e:x):d.acts.concat(e);
      saveDay(S.date,d);close();toast(edit?"Updated":"Added "+fmt(e.k)+" kcal burned");
    };
  });
}

render();
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
